<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Week At A Glance",
  "schemaVersion": 1,
  "description": "Live week-at-a-glance calendar view pulling events from Google Calendar for the current week (or next week on Fridays).",
  "mcpTools": [
    "mcp__fdecf106-fd1a-441d-945a-78524b3ed5bb__list_events"
  ],
  "mcpServerNames": [
    "Google Calendar"
  ]
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week at a Glance</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f6fa;
    color: #1a1a2e;
    padding: 20px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .week-range { font-size: 13px; color: #888; }
  .refresh-btn {
    margin-left: auto;
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    color: #555;
    cursor: pointer;
  }
  .refresh-btn:hover { background: #eee; }
  .status-bar {
    font-size: 11px;
    color: #aaa;
    margin-bottom: 16px;
    min-height: 14px;
  }
  .status-bar.error { color: #c44; }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .day-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 12px;
    border: 1px solid #e8e8ee;
    min-height: 160px;
    display: flex;
    flex-direction: column;
  }
  .day-card.today { border-color: #6c63ff; background: linear-gradient(135deg,#fdfcff,#f4f2ff); }
  .day-card.weekend { background: #fafafa; }
  .day-card.past { opacity: 0.45; }
  .day-name {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    color: #999; margin-bottom: 2px;
  }
  .day-card.today .day-name { color: #6c63ff; }
  .day-num { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; line-height: 1; }
  .day-card.today .day-num { color: #6c63ff; }
  .today-badge {
    display: inline-block; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    background: #6c63ff; color: #fff;
    border-radius: 4px; padding: 1px 5px;
    margin-left: 5px; vertical-align: middle;
  }
  .events-area { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .event-pill {
    background: #ede9ff;
    border-left: 3px solid #6c63ff;
    border-radius: 0 6px 6px 0;
    padding: 6px 8px;
    font-size: 11px; line-height: 1.4;
  }
  .event-time { font-weight: 600; color: #6c63ff; display: block; margin-bottom: 1px; }
  .event-title { font-weight: 500; color: #2d2d2d; display: block; }
  .event-loc { color: #888; font-size: 10px; display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clear-label { font-size: 11px; color: #ccc; margin-top: auto; padding-top: 8px; text-align: center; }
  .day-summary { font-size: 11px; color: #aaa; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <h1>Week at a Glance</h1>
  <span class="week-range" id="weekRange"></span>
  <button class="refresh-btn" onclick="loadWeek()">↻ Refresh</button>
</div>
<div class="status-bar" id="statusBar">Loading…</div>
<div id="weekGrid" class="week-grid"></div>

<script>
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Pre-fetched fallback data (week of Apr 27 – May 3 2026)
const FALLBACK = {
  weekStart: '2026-04-27',
  events: [
    {
      summary: 'Market Spotlight: Ohio Valley 2026',
      start: { dateTime: '2026-04-30T10:00:00-05:00' },
      end:   { dateTime: '2026-04-30T10:30:00-05:00' },
      location: 'The Westin Cincinnati, 21 E 5th St, Cincinnati, OH 45202, USA'
    }
  ]
};

function getMondayOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}${m ? ':' + String(m).padStart(2,'0') : ''}${ap}`;
}

function shortLoc(loc) {
  return loc ? loc.split(',')[0].trim() : null;
}

function renderGrid(monday, events) {
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  document.getElementById('weekRange').textContent =
    `${MONTHS[monday.getMonth()]} ${monday.getDate()} – ${MONTHS[sunday.getMonth()]} ${sunday.getDate()}, ${sunday.getFullYear()}`;

  const today = new Date();
  today.setHours(0,0,0,0);

  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return { date: d, events: [] };
  });

  for (const ev of events) {
    const start = ev.start?.dateTime || ev.start?.date;
    if (!start) continue;
    const evDay = new Date(start);
    evDay.setHours(0,0,0,0);
    for (const day of days) {
      if (day.date.toDateString() === evDay.toDateString()) day.events.push(ev);
    }
  }

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  for (const day of days) {
    const isToday   = day.date.toDateString() === today.toDateString();
    const isPast    = day.date < today && !isToday;
    const isWeekend = day.date.getDay() === 0 || day.date.getDay() === 6;

    const card = document.createElement('div');
    card.className = ['day-card',
      isToday   ? 'today'   : '',
      isWeekend ? 'weekend' : '',
      isPast    ? 'past'    : ''
    ].filter(Boolean).join(' ');

    // Day name
    const dn = document.createElement('div');
    dn.className = 'day-name';
    dn.textContent = DAYS[day.date.getDay()];
    card.appendChild(dn);

    // Date number
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = day.date.getDate();
    if (isToday) {
      const b = document.createElement('span');
      b.className = 'today-badge';
      b.textContent = 'Today';
      num.appendChild(b);
    }
    card.appendChild(num);

    // Events area
    const area = document.createElement('div');
    area.className = 'events-area';

    if (day.events.length === 0) {
      const cl = document.createElement('div');
      cl.className = 'clear-label';
      cl.textContent = isWeekend ? '—' : 'No events';
      area.appendChild(cl);
    } else {
      for (const ev of day.events) {
        const pill = document.createElement('div');
        pill.className = 'event-pill';
        const isAllDay = !ev.start?.dateTime;

        if (!isAllDay) {
          const t = document.createElement('span');
          t.className = 'event-time';
          t.textContent = `${fmtTime(ev.start.dateTime)}–${fmtTime(ev.end.dateTime)}`;
          pill.appendChild(t);
        }

        const tt = document.createElement('span');
        tt.className = 'event-title';
        tt.textContent = ev.summary || '(No title)';
        pill.appendChild(tt);

        const loc = shortLoc(ev.location);
        if (loc) {
          const le = document.createElement('span');
          le.className = 'event-loc';
          le.textContent = loc;
          pill.appendChild(le);
        }
        area.appendChild(pill);
      }
    }
    card.appendChild(area);

    // Summary
    if (!isPast || isToday) {
      const s = document.createElement('div');
      s.className = 'day-summary';
      s.textContent = day.events.length === 0
        ? (isWeekend ? 'Weekend' : 'Clear day')
        : day.events.length === 1 ? '1 event' : `${day.events.length} events`;
      card.appendChild(s);
    }

    grid.appendChild(card);
  }
}

async function loadWeek() {
  const statusEl = document.getElementById('statusBar');
  statusEl.className = 'status-bar';
  statusEl.textContent = 'Fetching calendar…';

  const today = new Date();
  today.setHours(0,0,0,0);
  const dow = today.getDay();

  let monday;
  if (dow >= 5 || dow === 0) {
    const next = new Date(today);
    next.setDate(today.getDate() + (dow === 0 ? 1 : 8 - dow));
    monday = getMondayOfWeek(next);
  } else {
    monday = getMondayOfWeek(today);
  }

  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,0);

  // Render fallback immediately while fetching
  renderGrid(monday, FALLBACK.events.filter(ev => {
    const d = new Date(ev.start?.dateTime || ev.start?.date);
    return d >= monday && d <= sunday;
  }));

  // Try live fetch
  if (typeof window.cowork === 'undefined') {
    statusEl.textContent = 'Showing cached data (calendar connector not available in this view)';
    return;
  }

  try {
    const raw = await window.cowork.callMcpTool(
      'mcp__fdecf106-fd1a-441d-945a-78524b3ed5bb__list_events',
      {
        startTime: monday.toISOString().slice(0,19),
        endTime:   sunday.toISOString().slice(0,19),
        orderBy:   'startTime',
        pageSize:  100
      }
    );
    const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    const events = data.events || [];
    renderGrid(monday, events);
    const now = new Date();
    statusEl.textContent = `Live · updated ${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  } catch (err) {
    statusEl.className = 'status-bar error';
    statusEl.textContent = `Live fetch failed — showing cached data. (${err.message})`;
  }
}

loadWeek();
</script>
</body>
</html>
